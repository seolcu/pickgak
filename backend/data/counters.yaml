# 상성·시너지 (손으로 정리)
#
# 상성은 data/matchups.json(실제 대결 데이터 기반 평점, counterwatch.gg 5v5)이 기본이다.
# 여기 counters: "키 영웅이 목록의 영웅들 상대로 유리하다". 평점이 없는 짝은 이것만 쓰고(±1), 평점이 있는
# 짝은 평점에 0.3을 더한다 (평점이 중립이어도 '유리'로 보인다. app/recommend/engine.py HAND_BONUS).
# synergy: 같이 있으면 좋은 조합. 아군에 있으면 서로 가산 (평점 데이터에는 시너지가 없어 여기서만 관리).
# 영웅 id는 넥슨 통계 페이지의 heroId를 쓴다. 상성 평점 갱신: uv run python -m app.collector.counterwatch

counters:
  # 돌격
  winston: [widowmaker, ana, zenyatta, genji, hanzo, ashe]
  # 매트릭스로 심장 과부하를 지운다 (장문철tv 790화). mauga: [dva]와 맞서 중립이 된다
