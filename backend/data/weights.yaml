# 추천 점수 가중치. 값을 바꾸고 서버를 다시 띄우면 적용된다.
map_meta: 1.0        # 선택한 맵 통계의 메타 점수 (역할 내 z-점수)
overall_meta: 0.5    # 전체 맵 통계의 메타 점수
counter: 0.6         # 적 영웅 1명당 상성 (+1 유리 / -1 불리)
synergy: 0.4         # 아군 영웅 1명당 시너지
preferred: 0.8       # 그 플레이어의 선호 영웅이면 가산
comp: 0.3            # 우리 팀 조합 유형(다이브·포킹 등)에 맞으면 그 영웅의 유형 점수(0~1)에 곱해 가산. 아군 2명 이상일 때만
threat_counter: 2.0  # 위험 플레이어로 표시한 적 영웅과의 상성에 곱하는 배수
threat_avoid: 1.5    # 위험 플레이어에게 크게 불리하면(상성 -0.5 이하) 추가로 깎는 배수
balance: 2.0         # 역할 균형 문제(서포터 힐량 부족, 메인·서브 짝 어긋남)의 크기에 곱해 감점
comp_counter: 0.2    # 상대 조합 유형에 강한 유형(다이브>포킹>러쉬·앵커, 러쉬>다이브)이면 그 유형 점수에 곱해 가산
