# Team archetypes ("comps") and how strongly each hero fits them (0..1).
# A hero can fit several archetypes. Heroes not listed (or unsure) are neutral:
# they get no comp bonus and don't pull the team toward an archetype.
#
# dive:   jump onto the backline together (mobility, burst, isolate targets)
# poke:   long-range damage from safe angles, barriers, sustain at range
# rush:   brawl / rush: fight close as a group with speed and sustain
# anchor: hold space and stay put (barriers, sustain, area denial)
#
# Seeded from common community knowledge; newer heroes are tagged only where
# their kit is documented (Domina: segmented-barrier poke tank; Vendetta: melee
# backline diver; Shion: flanker; Wuyang: ranged damage support; D.Mon: melee
# brawler for narrow maps; Jetpack Cat: flying, mobile kill-catch support, see
# docs/team-building.md). Heroes without a clear archetype (Anran, Emre, Mizuki,
# Sierra, Doctrine, who fits every comp) stay neutral.
archetypes: [dive, poke, rush, anchor]

# A team "is" an archetype when it has at least min_strength of it (sum of
# hero weights) and that is at least min_share of the team's total.
min_strength: 1.0
min_share: 0.5

heroes:
