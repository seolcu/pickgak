# Role balance inside a team (applied on top of archetype fit).
# Principles and sources: docs/team-building.md.
balance:
  # Damage and support are usually one "main" + one "sub" (Korean community
  # convention, see namu.wiki "오버워치/조합"):
  # - main damage: steady sustained damage from mid/long range
  # - sub damage: burst/utility, flanks and plays
  # Two mains (or two subs) works only in specific cases, so it is a mild penalty.
  main_dps: [sojourn, soldier-76, sierra, ashe, emre, widowmaker, cassidy, torbjorn, freja, hanzo]
  # - main healer: stable sustained healing; sub healer: burst/utility.
  #   Two main healers lack utility (mild penalty); two subs can work.
  main_heal: [lifeweaver, lucio, mercy, mizuki, brigitte, wuyang, juno]
  pair_penalty: { double_main_dps: 0.25, double_sub_dps: 0.15, double_main_heal: 0.15, weak_pair: 0.15 }
  # Maps built for main damage, where two mains is a normal pick (no penalty).
  main_dps_maps: [circuit-royal, havana]
  # Damage pairs whose weaknesses stack, so one answer shuts both down:
  # Genji + Widowmaker both lack firepower; Reaper + Junkrat cannot hit flyers.
  weak_pairs:
    - [genji, widowmaker]
    - [reaper, junkrat]
  # Healing output (0..1), separate from the main/sub label: the team needs at
  # least one support who can heal the main group alone. Two supports below
  # min_pair_heal together leave the team short on healing.
  # Tiers from a high-rank coach's composition guide (docs/team-building.md):
  # - 0.9 heals the group alone: Ana, Baptiste, Juno, Kiriko, Doctrine
  # - 0.75 decent healing, not a solo healer: Wuyang, Moira, Lifeweaver, Mercy
  # - 0.65 a step lower: Illari, Mizuki
  # - below: Jetpack Cat (heals fine but plays wide and aggressive), Lucio (area
  #   heal only, no single-target), Brigitte (no poke heal, cannot be the main
  #   healer), Sombra (a damage-leaning support since her rework), Zenyatta.
  # Heroes not listed fall back to their official subrole default.
  heal:
    ana: 0.9
    baptiste: 0.9
    juno: 0.9
    kiriko: 0.9
    doctrine: 0.9
    wuyang: 0.75
    moira: 0.75
    lifeweaver: 0.75
    mercy: 0.75
    illari: 0.65
    mizuki: 0.65
    jetpack-cat: 0.55
    lucio: 0.45
    brigitte: 0.45
    sombra: 0.35
    zenyatta: 0.3
  heal_by_subrole: { medic: 0.85, survivor: 0.6, tactician: 0.5 }
  min_pair_heal: 1.2

# Archetype triangle (namu.wiki, guildorder.com): what each comp is strong into.
# dive beats poke; rush beats dive; poke beats rush and anchor.
beats:
  dive: [poke]
  rush: [dive]
  poke: [rush, anchor]
  anchor: []
