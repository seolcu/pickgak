# 경쟁전 영웅 금지(밴) 규칙. 블리자드가 규칙을 바꾸면 이 파일만 고치면 된다.
# 2026-10 기준: 팀당 2명(총 4명), 같은 역할은 최대 2명까지, 각자 3명에게 7/5/3표로 투표.
# 로비 밴(2026-06-16 패치): 양 팀이 모두 표를 던진 영웅의 합계가 10표 이상이면 5번째로 금지된다.
# 판마다 생길 수도 안 생길 수도 있어서 사용자가 켠다. 로비 밴은 같은 역할 한도를 넘을 수 있다.
competitive:
  per_team: 2
  lobby: 1
  max_per_role: 2
  votes: [7, 5, 3]
# 이 밴률(%) 이상이면 "밴될 가능성 높음"으로 표시
high_ban_rate: 30

# 밴 추천 가중치: 우리 파티가 팀에서 차지하는 비율(파티 인원 ÷ 팀 인원)에 따라 두 값 사이를 부드럽게 오간다.
# - 혼자·듀오: 다른 팀원도 표를 줄 만한 영웅(밴률 높은 영웅)을 크게 본다. 우리만 원하는 밴은 표가 갈려 꼬이기 쉽다
# - 5인큐: 우리가 밴을 정할 수 있으니 우리 영웅을 카운터하는 영웅을 크게 본다
weights:
  popularity: { solo: 3.0, full: 0.5 }  # 밴률 100%일 때 더하는 점수
  threat: { solo: 0.35, full: 1.5 }     # 우리 영웅 카운터 점수에 곱하는 배수
