name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its previous run; runs on main always finish (release builds come from them).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Everything runs on GitHub-hosted runners (free for a public repository). `pick` decides, per run, which
# parts changed. The tests that read real match captures skip themselves here: those captures have
# players' names on them and live in a private submodule (app/crates/vision/tests/fixtures).
# Never add a self-hosted runner here: any fork's pull request could run code on it.
jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$PR_BASE...$PR_HEAD")
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            files=everything
          fi
          has() { { [ "$files" = everything ] || grep -qE "$1" <<<"$files"; } && echo true || echo false; }
          {
            echo "backend=$(has '^(backend|\.github)/')"
            echo "frontend=$(has '^(frontend|\.github)/')"
            echo "app=$(has '^(app|\.github)/')"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    needs: pick
    if: ${{ needs.pick.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run pytest -q

  frontend:
    needs: pick
    if: ${{ needs.pick.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  desktop-core:
    # Scoreboard reading and TAB capture crates (pure Rust; the Tauri shell is built in app/docker).
    # Without the private captures most vision tests skip themselves; run them locally with the submodule.
    needs: pick
    if: ${{ needs.pick.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy -p pickgak-vision -p pickgak-live --all-targets -- -D warnings
      - run: cargo test -p pickgak-vision -p pickgak-live
