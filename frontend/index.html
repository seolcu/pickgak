<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1218" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>PickGak</title>
    <script>
      // Apply theme and language before first paint (same keys as ThemeProvider / i18n)
      try {
        var t = localStorage.getItem("pickgak.theme") || localStorage.getItem("owpick.theme") || "system";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        // ?lang=ko|en 주소(검색 결과의 언어별 주소)로 오면 그 언어를 고른 것으로 친다
        var q = new URLSearchParams(location.search).get("lang");
        if (q === "ko" || q === "en") localStorage.setItem("pickgak.lang", q);
        var l = localStorage.getItem("pickgak.lang") || (navigator.languages || [navigator.language])[0] || "en";
        document.documentElement.lang = /^ko/i.test(l) ? "ko" : "en";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
