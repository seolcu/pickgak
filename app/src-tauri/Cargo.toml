[package]
name = "pickgak"
description = "PickGak desktop: Overwatch hero pick helper with TAB-triggered scoreboard capture."
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["tray"]
# The Flatpak runtime has no libappindicator; the Flatpak build turns the tray off.
tray = ["tauri/tray-icon"]

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "blocking"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
sha2 = "0.10"
cookie_store = "0.22"
reqwest_cookie_store = "0.9"
wait-timeout = "0.2"
pickgak-vision = { path = "../crates/vision" }
pickgak-live = { path = "../crates/live" }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
